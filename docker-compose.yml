# version: '3.8'
services:
  # 1. Kulkas (Database Session)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 2. Otak Backend (FastAPI)
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"

    env_file:
      - .env
    environment:
     - REDIS_HOST=redis
    depends_on:
      - redis

volumes:
  redis_data: